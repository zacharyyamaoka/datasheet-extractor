[project]
name = "datasheet-extractor"
version = "0.1.0"
description = "Datasheet Extractor v0: a field list in, checked values out (Markdownify CONTRACT §7)."
readme = "README.md"
authors = [
    { name = "Zach Yamaoka", email = "zach.yamaoka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
extract = "datasheet_extractor.cli:main"
