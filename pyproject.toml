[project]
name = "datasheet-extractor"
version = "0.1.0"
description = "Datasheet Extractor v0: a field list in, checked values out (Markdownify CONTRACT §7)."
readme = "README.md"
authors = [
    { name = "Zach Yamaoka", email = "zach.yamaoka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    # WHY named though pdfplumber already brings them: locate reads an OCR'd page's ink (src/datasheet_extractor/ink.py)
    "pillow>=12",
    "pypdfium2>=4",
    "source-msgs",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
# WHY source_msgs (source-highlighter PEP 0001, stdlib only): a value's `where` is written with its selectors' own
# compact(), so what Copy as Spec emits is what robotparts' test_every_where_is_a_source_msgs_selector parses.
source-msgs = { git = "https://github.com/zacharyyamaoka/source-highlighter", subdirectory = "packages/source_msgs" }

[project.scripts]
extract = "datasheet_extractor.cli:main"
